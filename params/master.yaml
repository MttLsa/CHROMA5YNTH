params:
  - id: master_volume
    name: Master Volume
    type: float
    min: -60.0
    max: 6.0
    default: 0.0
    skew: -12.0
    step: 0.01
    unit: dB
    section: Master
    description: Livello di uscita finale, prima del limiter.

  - id: preset_trim
    name: Preset Trim
    type: float
    min: -24.0
    max: 24.0
    default: 0.0
    step: 0.01
    unit: dB
    section: Master
    description: "Trim di loudness del Multi preset (scritto da tools/presetnorm: −14 LUFS short-term max, mai sopra −1 dBTP). Sommato al Master Volume."
    automatable: false
    gui: false

  - id: master_polyphony
    name: Polyphony
    type: choice
    choices: ["12", "24", "36"]
    default: "24"
    section: Master
    description: Dimensione del pool globale di voci condiviso tra i layer.
    automatable: false

  - id: scale_on
    name: Note Assign
    type: bool
    default: false
    section: Scale
    description: "NOTE ASSIGN attivo: ogni nota della scala cromatica suona solo il synth assegnato (menu sulla nota; Off = nota muta). Spento = ogni synth attivo suona tutte le note."

  - id: gscale_on
    name: Global Scale
    type: bool
    default: false
    section: Global Scale
    description: "GLOBAL SCALE: corregge in tempo reale il pitch dell'uscita di ogni synth verso le note della scala scelta (correzione spettrale continua, come il motore e il riconoscimento dei moduli MELODIC di Groovulation). Agisce sul suono, non sui parametri. Aggiunge latenza (compensata dalla DAW)."

  - id: gscale_root
    name: Global Scale Root
    type: choice
    choices: ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
    default: "C"
    section: Global Scale
    description: Tonica della scala.

  - id: gscale_scale
    name: Global Scale Type
    type: choice
    choices: ["Major", "Minor", "Dorian", "Mixolydian", "Lydian", "Phrygian", "Locrian", "Whole Tone", "Half-whole Dim.", "Whole-half Dim.", "Minor Blues", "Minor Pentatonic", "Major Pentatonic", "Harmonic Minor", "Harmonic Major", "Dorian #4", "Phrygian Dominant", "Melodic Minor", "Lydian Augmented", "Lydian Dominant", "Super Locrian", "8-Tone Spanish", "Bhairav", "Hungarian Minor", "Hirajoshi", "In-Sen", "Iwato", "Kumoi", "Pelog Selisir", "Pelog Tembung", "Messiaen 3", "Messiaen 4", "Messiaen 5", "Chromatic"]
    default: "Major"
    section: Global Scale
    description: Scala (stesso elenco delle scale di Ableton Live).

  - id: gscale_mode
    name: Global Scale Mode
    type: choice
    choices: [Poly, Mono]
    default: Poly
    section: Global Scale
    description: "Poly = ogni componente dello spettro va sulla nota di scala più vicina (accordi, suoni inarmonici). Mono = riconosce la fondamentale (YIN, come Groovulation) e sposta tutto il suono dello stesso intervallo: timbro armonico intatto (lead, bassi)."

  - id: gscale_amount
    name: Global Scale Amount
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    unit: "%"
    section: Global Scale
    description: "Forza della correzione: 0% = suono originale, 100% = ogni componente intonata sulla nota di scala più vicina."

  - id: gscale_smooth
    name: Global Scale Smooth
    type: float
    min: 0.0
    max: 1.0
    default: 0.35
    unit: "%"
    section: Global Scale
    description: "Morbidezza: larghezza della transizione tra due note di scala. 0% = scatto netto da una nota all'altra, valori alti = passaggio continuo e graduale."

  - id: mpe_on
    name: MPE
    type: bool
    default: false
    section: MPE
    description: Abilita MPE (pitch, pressure e slide per nota sui canali membri).

  - id: mpe_zone
    name: MPE Zone
    type: choice
    choices: [Lower, Upper]
    default: Lower
    section: MPE
    description: "Zona MPE: Lower = master canale 1, membri 2–16; Upper = master canale 16, membri 1–15."
    automatable: false

  - id: mpe_bend_range
    name: MPE Bend Range
    type: int
    min: 1
    max: 96
    default: 48
    unit: st
    section: MPE
    description: Escursione del pitch bend per nota sui canali membri MPE.
    automatable: false

blocks:
  - repeat:
      count: 12
      vars:
        key: [c, cs, d, ds, e, f, fs, g, gs, a, as, b]
        note: ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
    params:
      - id: scale_{key}
        array: scaleSlot
        name: Scale {note}
        type: int
        min: 0
        max: 4095
        default: 1
        section: Scale
        description: "Slot {note}: maschera dei Layer assegnati (bit 0 = Layer 1 … bit 11 = Layer 12). 0 = nota muta."
        automatable: false
        gui: false
