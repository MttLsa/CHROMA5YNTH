name: build

on:
  push:
    branches: ["**"]
    tags: ["chroma5ynth-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. chroma5ynth-v1.0.0); empty = build only"
        required: false
        default: ""

env:
  PLUGIN: CHROMA5YNTH
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}
  PLUGINVAL_VERSION: v1.0.4

jobs:
  macos:
    runs-on: macos-15-intel
    env:
      # Optional signing / notarization: active only if these secrets exist.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MAC_APP_SIGN_ID: ${{ secrets.MAC_APP_SIGN_ID }}
      MAC_INSTALLER_SIGN_ID: ${{ secrets.MAC_INSTALLER_SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then V="${RELEASE_TAG#chroma5ynth-v}"; elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#chroma5ynth-v}"; else V="$(grep -m1 -oE 'project\(CHROMA5YNTH VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: python -m pip install pyyaml
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DPython3_EXECUTABLE="$(python -c 'import sys;print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check Universal binaries
        run: |
          lipo -info "build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3/Contents/MacOS/${PLUGIN}"
          lipo -info "build/${PLUGIN}_artefacts/Release/AU/${PLUGIN}.component/Contents/MacOS/${PLUGIN}"
      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"
          security list-keychains -d user -s "$KC"
      - name: Codesign plugins (optional)
        if: env.MAC_APP_SIGN_ID != ''
        run: |
          for b in "build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3" "build/${PLUGIN}_artefacts/Release/AU/${PLUGIN}.component"; do
            codesign --force --deep --timestamp --options runtime --sign "$MAC_APP_SIGN_ID" "$b"
          done
      - name: Install plugins for validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R "build/${PLUGIN}_artefacts/Release/AU/${PLUGIN}.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3" ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar || true
      - name: auval
        run: |
          auval -a | grep -i "Tmfu" || true
          auval -strict -v aumu Chr5 Tmfu
      - name: pluginval
        run: |
          curl -sSL --retry 5 --retry-all-errors --retry-delay 15 -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 300000 ~/Library/Audio/Plug-Ins/VST3/${PLUGIN}.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 300000 ~/Library/Audio/Plug-Ins/Components/${PLUGIN}.component
      - name: Build .pkg
        run: installer/macos/build_pkg.sh "build/${PLUGIN}_artefacts/Release" "$VERSION" dist
      - name: Notarize (optional)
        if: env.NOTARY_APPLE_ID != '' && env.MAC_INSTALLER_SIGN_ID != ''
        run: |
          PKG="dist/${PLUGIN}-${VERSION}-macOS.pkg"
          xcrun notarytool submit "$PKG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.pkg

  manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: python -m pip install pyyaml markdown weasyprint
      - name: Check generated parameter tables are up to date
        run: |
          python tools/gen_params.py --params params --out "$RUNNER_TEMP/gen" --docs docs/manual/parameters.md --docs-en docs/manual/en/parameters.md
          git diff --exit-code docs/manual
      - name: Build manual (site + PDF)
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then V="${RELEASE_TAG#chroma5ynth-v}"; elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#chroma5ynth-v}"; else V="$(grep -m1 -oE 'project\(CHROMA5YNTH VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')"; fi
          python tools/build_manual.py --out site --version "$V"
          mkdir -p pdf && cp site/*.pdf pdf/
      - uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: pdf/*.pdf
      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/chroma5ynth-v') || startsWith(env.RELEASE_TAG, 'chroma5ynth-v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true

  release:
    if: startsWith(github.ref, 'refs/tags/chroma5ynth-v') || startsWith(github.event.inputs.release_tag, 'chroma5ynth-v')
    needs: [macos, manual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CHROMA5YNTH ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            **CHROMA5YNTH** by TMFU audiovibe – macOS (Universal, 10.13+), VST3 + Audio Unit.

            - Installer: `CHROMA5YNTH-*-macOS.pkg` (not signed: see the manual, *Installazione / Installation*).
            - Manuale / Manual: https://mttlsa.github.io/CHROMA5YNTH/ · PDF IT/EN attached below.
